<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipper - SSR_CLIPPER</title>
  <meta name="description" content="AI-powered YouTube short-form content clipper. Create TikTok, Reels, and Shorts from long-form videos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // Capture ALL frontend JS errors → sent to Python error.log
    window.onerror = function(message, source, lineno, colno, error) {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.log_frontend_error(
          String(message),
          String(source),
          lineno || 0,
          colno || 0,
          error && error.stack ? String(error.stack) : ''
        );
      }
      return false; // still show in browser console
    };
    window.addEventListener('unhandledrejection', function(e) {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.log_frontend_error(
          'Unhandled Promise rejection: ' + (e.reason ? String(e.reason) : 'unknown'),
          'promise', 0, 0,
          e.reason && e.reason.stack ? String(e.reason.stack) : ''
        );
      }
    });
  </script>
  <script src="components/header.js"></script>
  <script src="components/file-item.js"></script>
  <script src="components/dashboard.js"></script>
  <script src="components/campaign-list.js"></script>
  <script src="components/campaign-edit.js"></script>
  <script src="components/home.js"></script>
  <script src="components/stock-clip.js"></script>
  <script src="components/ai-settings.js"></script>
  <script src="app.js"></script>
  <script src="campaigns.js"></script>
</body>
</html>
